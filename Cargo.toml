[package]
name = "upd"
version = "5.0.1"
edition = "2024"
rust-version = "1.100"
description = "Monitors the network connection and runs a command when it is down"
repository = "https://github.com/hugoh/upd"
license = "MIT"
include = ["/src", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1.0.104"
backon = { version = "1.6.0", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
fastrand = "2.5.0"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "registry", "std"] }
url = "2.5.8"
xdg = "3.0.0"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
assert_is_empty = "allow"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
