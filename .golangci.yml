# DO NOT EDIT — managed by hugoh/go-tools via copier.
version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - noinlineerr
    - paralleltest
    - testpackage
    - godoclint
    - wsl
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - err113
          - varnamelen
          - noctx
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
