---
name: cross

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cross-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - mise.toml
              - mise.release.toml
              - mise.package.toml
              - .anodizer.yaml
              - .github/workflows/cross.yml

  # Proves every release target still builds and packages, without publishing. It mirrors the
  # release's build and merge jobs.
  anodizer:
    name: anodizer (${{ matrix.name }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.build == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux, os: ubuntu-latest}
          - {name: darwin, os: macos-latest}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MISE_ENV: release,package
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "1"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: anodizer-${{ matrix.name }}
      - run: anodizer check config
      - run: anodizer release --split --snapshot --clean
      # Hidden files are dropped by default and would only surface at merge time.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  merge:
    name: anodizer (merge)
    needs: anodizer
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: release,package
    steps:
      - uses: hugoh/gh-workflows/setup@12a131c8eca966fe30bcc4ca670fa596b375702f # v1.40.19
        with:
          fetch-depth: "1"
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: anodizer-merge
          save-if: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          pattern: dist-*
          merge-multiple: true
      - name: Restore execute bit
        run: find dist -type f -name upd -exec chmod +x {} +
      - name: Every OS has its own shard
        run: |
          for shard in linux darwin; do
            [ -f "dist/$shard/context.json" ] || { echo "::error::missing dist/$shard/context.json"; exit 1; }
          done
      - run: anodizer release --snapshot --merge

  # Single required check: path-filtered jobs that never run would leave their own checks pending.
  anodizer-gate:
    needs: [changes, anodizer, merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
