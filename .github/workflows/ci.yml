    uses: hugoh/go-tools/.github/workflows/go-hk.yml@977317b2cb6a46b4d47c531556fbb991a9bbde52 # v1.23.0
    permissions:
      contents: read

  goci:
    uses: hugoh/go-tools/.github/workflows/go-ci.yml@977317b2cb6a46b4d47c531556fbb991a9bbde52 # v1.23.0
    permissions:
      contents: read

  release:
    needs: [hk, goci]
    uses: hugoh/go-tools/.github/workflows/go-release.yml@977317b2cb6a46b4d47c531556fbb991a9bbde52 # v1.23.0
    permissions:
      contents: write
    with:
      bump_type: ${{ inputs.bump_type || 'auto' }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      tap_github_token: ${{ secrets.TAP_GITHUB_TOKEN }}
